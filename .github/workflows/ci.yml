name: ci

# Smoke gate: prove the murder wheel builds (the hatch hook + esbuild bundle assemble) and the
# shipped Ink bundle loads under each supported Node version — catching a broken inktui/src or a
# busted build hook BEFORE a release tag, not during. Linux-only; the only axis that varies across
# distros is the Node version, so we matrix that.
on:
  pull_request:
  push:
    branches: [main]

concurrency:                 # kill stale runs on rapid re-push (saves minutes)
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, latest]   # the axis that actually varies; distros do not
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install Python dependencies
        run: uv sync --frozen --no-dev
      - name: Install frontend workspace
        run: npm ci
      - name: Verify generated application protocol is committed
        run: uv run --no-sync python tools/generate_application_protocol.py --check
      - name: Typecheck frontend workspaces
        run: npm run typecheck
      - name: Test frontend workspaces
        run: npm run test
      - name: Bundle Ink workspace
        run: npm run bundle -w inktui
      - name: Build web workspace
        run: npm run build -w webui
      # Build the wheel (proves the hook + esbuild bundle assemble), install it, then run the
      # shipped bundle's --smoke (F7) resolved exactly as the launcher resolves it at runtime —
      # via importlib.resources, from the installed package, not the repo tree. `uv build`
      # builds the wheel from the sdist in a temp dir, so the bundle does NOT land at the repo path.
      - run: uv build
      - run: uv pip install --reinstall --no-deps dist/*.whl
      - name: Smoke the shipped Ink bundle
        # Resolve + run from outside the checkout so `murder` resolves to the installed wheel (the
        # repo's own murder/ package would otherwise shadow it on the implicit path).
        working-directory: ${{ runner.temp }}
        run: |
          BUNDLE="$($GITHUB_WORKSPACE/.venv/bin/python -c 'import importlib.resources as r; print(r.files("murder") / "_inktui" / "index.js")')"
          echo "Bundle: $BUNDLE"
          node "$BUNDLE" --smoke
