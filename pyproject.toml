[build-system]
requires = ["hatchling>=1.27", "pydantic>=2.6,<3.0", "pyyaml>=6.0,<7.0"]
build-backend = "hatchling.build"

[project]
name = "murder"
version = "0.0.1"
description = "Agentic dev harness — a murder of crows supervising a monkey."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND OFL-1.1 AND LicenseRef-murder-brand-assets"
license-files = ["LICENSE", "BRANDING.md", "LICENSES/*"]
authors = [{ name = "Luke Askew", email = "root@askew.sh" }]
dependencies = [
    "pydantic>=2.6,<3.0",
    "typer>=0.12,<1.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "anyio>=4.3,<5.0",
    "watchfiles>=0.21,<2.0",  # cross-platform inotify-ish watcher (D5)
    # Application WebSocket server (`/api/ws`) — required for supervisor startup.
    "aiohttp>=3.9,<4.0",
    # Context Assembler 2 structural extractors (tree-sitter grammars load fail-soft).
    "tree-sitter>=0.23.0,<0.27",
    "tree-sitter-javascript>=0.23.0,<0.26",
    "tree-sitter-typescript>=0.23.0,<0.24",
    "tree-sitter-rust>=0.23.0,<0.26",
    "tree-sitter-c>=0.23.0,<0.26",
    "tree-sitter-cpp>=0.23.0,<0.24",
    "tree-sitter-go>=0.23.0,<0.26",
    "tree-sitter-html>=0.23.0,<0.26",
    "tree-sitter-css>=0.23.0,<0.26",
    "tree-sitter-scss>=1.0.0,<2.0",
    "tree-sitter-less>=1.0.0,<2.0",
    # TODO(M0): tiktoken for D17 if/when context-cap enforcement lands
]

[project.optional-dependencies]
# Kept for backwards-compatible `murder[web]` installs; aiohttp is now a core dep
# (application WebSocket at `/api/ws`), so this extra is a no-op alias.
web = ["aiohttp>=3.9,<4.0"]
# Claude Agent SDK control backend for Claude Code (`claude_control_backend=agent_sdk`).
agent_sdk = ["claude-agent-sdk>=0.1.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.4",
    "aiohttp>=3.14.1",
]

[project.scripts]
# Bare `murder` is the kickoff command per D8.
murder = "murder.app.cli:app"

[tool.hatch.build]
include = [
    "murder/llm/prompts/*.md",
    "murder/resources/templates/*",
    "murder/resources/themes/*",
]

# Bundles the Ink TUI into the wheel (esbuild → murder/_inktui/index.js).
[tool.hatch.build.hooks.custom]
path = "tools/packaging/hatch_build.py"

# The sdist must carry the workspace's build inputs because `python -m build` builds the wheel from
# the sdist. The custom hook runs one root `npm ci`, regenerates the protocol, then bundles
# inktui and builds webui. dist/ and node_modules are excluded so we ship source only.
[tool.hatch.build.targets.sdist]
include = [
    "murder/",
    "tests/",
    "package.json",
    "package-lock.json",
    "tsconfig.base.json",
    "ui-core/**",
    "ui-core/src/",
    "ui-core/test/",
    "ui-core/package.json",
    "ui-core/tsconfig.json",
    "ui-core/tsconfig.test.json",
    "ui-core/vitest.config.ts",
    "inktui/src/",
    "inktui/stubs/",
    "inktui/package.json",
    "inktui/tsconfig.json",
    "inktui/tsconfig.test.json",
    "inktui/tsconfig.dev.json",
    "inktui/biome.json",
    "webui/src/",
    "webui/index.html",
    "webui/package.json",
    "webui/vite.config.ts",
    "webui/tsconfig.json",
    "webui/tsconfig.app.json",
    "tools/generate_application_protocol.py",
    "tools/packaging/hatch_build.py",
    "pyproject.toml",
    "README.md",
    "BRANDING.md",
    "LICENSE",
    "LICENSES/",
]
exclude = [
    "node_modules/",
    "ui-core/dist/",
    "inktui/dist/",
    "webui/dist/",
]

[tool.hatch.build.targets.wheel]
packages = ["murder"]
# Both front-ends are generated + gitignored; the hook force-includes them, and these keep them in
# the wheel even though they are not tracked by VCS.
artifacts = [
    "murder/_inktui/*",
    "murder/_webui/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# TODO(M0): tighten lints once code lands
select = ["E", "F", "I", "B", "UP", "PL"]
ignore = ["PLR0913"]  # allow many args on dataclasses / pydantic models

[tool.ruff.lint.per-file-ignores]
# Structural parsers are intentionally branch-heavy dispatch code; the numeric
# thresholds below describe syntax shapes rather than reusable policy knobs.
"murder/context_compiler/extraction/**/*.py" = ["PLR0911", "PLR0912", "PLR0915", "PLR2004"]
"murder/context_compiler/indexing/{coordinator,files}.py" = ["PLR0911", "PLR0912", "PLR0915"]
"murder/context_compiler/candidates/{exact_hints,lexical}.py" = ["PLR0911", "PLR0912", "PLR2004"]
"tests/unit/test_context_compiler*.py" = ["PLR2004"]

[tool.mypy]
python_version = "3.10"
strict = true
# TODO(M0): re-enable disallow_untyped_decorators once Textual stubs settle
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# `auto` so an un-marked `async def test_...` actually runs instead of being
# collected and silently passing without execution. Tests using the explicit
# `@pytest.mark.asyncio` marker continue to work unchanged.
asyncio_mode = "auto"
markers = [
    "smoke: real cursor/CC/API; requires MURDER_MANUAL_SMOKE=1",
    "integration: needs a live tmux server",
    "slow: slow test (real subprocess/git); deselect with -m 'not slow'",
    "live: needs live vendor CLIs/network; gated behind an env var",
    "quarantine: known-flaky; excluded from the default run",
]
